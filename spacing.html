<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spiral FFT: ring spacing</title>
<style>
  body { margin: 0; padding: 16px; background: #111; color: #ddd; font: 14px system-ui, sans-serif; }
  .row { display: flex; gap: 16px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { margin-bottom: 4px; color: #aaa; }
  /* Canvases are 512x512 internally, displayed at 400x400. Since the images
     are (nearly) symmetric, only the right 2/3 of each is shown. */
  .crop { width: calc(400px * 2 / 3); height: 400px; overflow: hidden; border: 1px solid #333; background: #000; }
  .crop canvas { display: block; width: 400px; height: 400px; margin-left: calc(-400px / 3); }
  #spiral { cursor: crosshair; }
  .left { display: flex; flex-direction: column; gap: 14px; }
  #cohZoom { display: block; width: calc(400px * 2 / 3); height: calc(400px * 2 / 3); border: 1px solid #333; background: #000; }
  #profile { display: block; width: calc(2 * (400px * 2 / 3 + 2px) + 16px); height: 215px; border: 1px solid #333; background: #000; box-sizing: border-box; }
  .side { width: 330px; }
  .controls { display: grid; grid-template-columns: 120px 1fr 40px; gap: 6px 8px; align-items: center; margin-top: 14px; }
  .controls input[type=range] { width: 100%; }
  .controls output { font-variant-numeric: tabular-nums; }
  .hint { color: #888; margin-top: 12px; line-height: 1.4; }
  .button { display: inline-block; margin-top: 18px; margin-right: 6px; padding: 5px 12px; border: 1px solid #555; border-radius: 4px; background: #222; color: #ddd; text-decoration: none; font: inherit; cursor: pointer; }
  .button:hover { background: #333; border-color: #777; }
</style>
</head>
<body>
<div class="row">
<div class="left">
<div class="row">
  <figure>
    <figcaption>Image (drag to move center)</figcaption>
    <div class="crop"><canvas id="spiral" width="512" height="512"></canvas></div>
  </figure>
  <figure>
    <figcaption>log |FFT|</figcaption>
    <div class="crop"><canvas id="fft" width="512" height="512"></canvas></div>
  </figure>
</div>
  <figure>
    <figcaption>Radial profile of log |FFT|: mean brightness vs. distance from center</figcaption>
    <canvas id="profile"></canvas>
  </figure>
<div class="row" id="cohRow">
  <figure>
    <figcaption>Spiral coherence |Z| (cyan +: symmetry center)</figcaption>
    <div class="crop"><canvas id="coh" width="512" height="512"></canvas></div>
  </figure>
  <figure>
    <figcaption>|Z| near the peak, ±3 spacings</figcaption>
    <canvas id="cohZoom" width="400" height="400"></canvas>
  </figure>
</div>
</div>
<div class="side">
<a class="button" href="index.html">&larr; Experiments</a><a class="button" href="explain.html" target="_blank">Explain</a><a class="button" href="procedure.html" target="_blank">Procedure</a><button class="button" id="defaults" type="button">Defaults</button>
<div class="controls">
  <label for="spacing">Ring spacing (px)</label>
  <input id="spacing" type="range" min="2" max="64" step="0.1" value="10"><output for="spacing"></output>

  <label for="rStart">Start radius (px)</label>
  <input id="rStart" type="range" min="0" max="250" step="1" value="50"><output for="rStart"></output>

  <label for="rEnd">End radius (px)</label>
  <input id="rEnd" type="range" min="0" max="250" step="1" value="200"><output for="rEnd"></output>

  <label for="phase">Phase (deg)</label>
  <input id="phase" type="range" min="0" max="360" step="1" value="0"><output for="phase"></output>

  <label for="aspect">Aspect (x, 1/y)</label>
  <input id="aspect" type="range" min="0.95" max="1.05" step="0.001" value="1"><output for="aspect"></output>

  <label for="off20">Offset at 20% (× spacing)</label>
  <input id="off20" type="range" min="-1" max="1" step="0.05" value="0"><output for="off20"></output>

  <label for="off40">Offset at 40% (× spacing)</label>
  <input id="off40" type="range" min="-1" max="1" step="0.05" value="0"><output for="off40"></output>

  <label for="off60">Offset at 60% (× spacing)</label>
  <input id="off60" type="range" min="-1" max="1" step="0.05" value="0"><output for="off60"></output>

  <label for="off80">Offset at 80% (× spacing)</label>
  <input id="off80" type="range" min="-1" max="1" step="0.05" value="0"><output for="off80"></output>

  <label for="lineWidth">Line width (px)</label>
  <input id="lineWidth" type="range" min="0" max="10" step="0.1" value="4"><output for="lineWidth"></output>

  <label for="softness">Edge transition (px)</label>
  <input id="softness" type="range" min="0" max="6" step="0.1" value="2"><output for="softness"></output>

  <label for="blur">Blur sigma (px)</label>
  <input id="blur" type="range" min="0" max="4" step="0.1" value="0"><output for="blur"></output>

  <label for="noise">Noise sigma</label>
  <input id="noise" type="range" min="0" max="1" step="0.01" value="0"><output for="noise"></output>

  <label for="gain">FFT contrast</label>
  <input id="gain" type="range" min="0.2" max="4" step="0.05" value="1"><output for="gain"></output>

  <label for="advanced">Advanced peak search</label>
  <input id="advanced" type="checkbox" checked><span></span>

  <label for="hVar">Expected spacing variation (±%)</label>
  <input id="hVar" type="range" min="0" max="30" step="1" value="10"><output for="hVar"></output>

  <label for="gradVote">Gradient-line center</label>
  <input id="gradVote" type="checkbox"><span></span>

  <label for="gvPerBin">Lines per orientation</label>
  <input id="gvPerBin" type="range" min="10" max="1000" step="10" value="150"><output for="gvPerBin"></output>

  <label for="gvFloor">Strength floor (percentile)</label>
  <input id="gvFloor" type="range" min="0" max="99" step="1" value="70"><output for="gvFloor"></output>

  <label for="gvTang">Tangential blur σ (px)</label>
  <input id="gvTang" type="range" min="0" max="8" step="0.5" value="3"><output for="gvTang"></output>

  <label for="gvShow">Show blurred image</label>
  <input id="gvShow" type="checkbox" checked><span></span>

  <label for="cohOn">Coherence center</label>
  <input id="cohOn" type="checkbox" checked><span></span>

  <label for="cohSp">Spacing for Z</label>
  <select id="cohSp"><option value="fft" selected>FFT estimate</option><option value="true">true spacing</option></select><span></span>

  <label for="evenW">Turn weighting</label>
  <select id="evenW"><option value="0">by length (none)</option><option value="0.5" selected>1/√r (halfway)</option><option value="1">1/r (equal turns)</option></select><span></span>

  <label for="isSpiral">Rings/spiral</label>
  <input id="isSpiral" type="checkbox" checked><span></span>

  <label for="smooth">Smooth line edges</label>
  <input id="smooth" type="checkbox" checked><span></span>

  <label for="removeDC">Subtract mean</label>
  <input id="removeDC" type="checkbox" checked><span></span>

  <label for="window">Hann window</label>
  <input id="window" type="checkbox" checked><span></span>

  <label for="showRing">Show 1/spacing</label>
  <input id="showRing" type="checkbox"><span></span>
</div>
<p class="hint" id="cohOut"></p>
<p class="hint" id="gvOut"></p>
<p class="hint">Center: <span id="centerOut"></span> — drag anywhere in the image to move it (hold Shift for 10× finer). Arrow keys nudge 1 px (Shift: 0.1 px). Double-click to recenter.</p>
</div>
</div>

<script src="render.js"></script>
<script src="fftspacing.js"></script>
<script src="gradcenter.js"></script>
<script src="coherence.js"></script>
<script src="spacing.js"></script>
</body>
</html>
